<!DOCTYPE html>
<html>
<head>
<title>WEB Tech LAB</title>

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial}

header{
 position:fixed;top:0;width:100%;height:60px;
 display:flex;align-items:center;justify-content:space-between;
 padding:10px 25px;border-bottom:1px solid #ddd;
 background:white
}

.logo{color:red;font-size:22px;font-weight:bold}
.search{width:40%;padding:8px}
.profile{width:25px;height:25px;background:#777;border-radius:50%}

aside{
 position:fixed;top:60px;bottom:40px;width:160px;
 padding:15px;background:#fafafa
}

aside a{
 display:block;padding:12px;color:#333;text-decoration:none
}
aside a:hover{background:#ddd}

main{margin-left:160px;padding:80px 20px 60px}

.grid{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:15px
}

.video div{
 height:120px;
 background:#ddd
}

.video h3{font-size:14px;padding:6px}

footer{
 position:fixed;bottom:0;width:100%;height:40px;
 text-align:center;padding:12px;
 border-top:1px solid #ddd;
 background:white
}

@media(max-width:700px){
 .grid{grid-template-columns:repeat(2,1fr)}
 aside{width:100px}
 main{margin-left:100px}
}
</style>
</head>

<body>

<header>
 <div class="logo">MyTube</div>
 <input class="search" placeholder="Search">
 <div class="profile"></div>
</header>

<aside>
 <a href="#">Home</a>
 <a href="#">Trending</a>
 <a href="#">Subscriptions</a>
 <a href="#">Library</a>
 <a href="#">History</a>
 <a href="#">Watch Later</a>
</aside>

<main>
 <div class="grid">
  <div class="video"><div></div><h3>Video Title 1</h3></div>
  <div class="video"><div></div><h3>Video Title 2</h3></div>
  <div class="video"><div></div><h3>Video Title 3</h3></div>
  <div class="video"><div></div><h3>Video Title 4</h3></div>
  <div class="video"><div></div><h3>Video Title 5</h3></div>
  <div class="video"><div></div><h3>Video Title 6</h3></div>
 </div>
</main>

<footer>© 2026 MyTube - All Rights Reserved</footer>

</body>
</html>
