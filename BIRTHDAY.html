<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Birthday</title>

    <style>
        #main {
            height: 300px;
            width: 300px;
            background-color: pink;
            position: relative;
            margin: auto;
            overflow: hidden;
        }

        #greet {
            text-align: center;
            padding-top: 50%;
        }

        #door1 {
            height: 100%;
            width: 50%;
            background-color: red;
            position: absolute;
            top: 0;
            left: 0;
        }

        #door2 {
            height: 100%;
            width: 50%;
            background-color: grey;
            position: absolute;
            top: 0;
            left: 50%;
        }

        #main:hover #door1 {
            transform: translateX(-400px);
            opacity: 0;
            transition: all 5s 0.5s;
        }

        #main:hover #door2 {
            transform: translateX(400px);
            opacity: 0;
            transition: all 5s 0.5s;
        }

        #main:hover #greet {
            transform: scale(1.5);
            transition: all 5s 0.5s;
        }
    </style>
</head>

<body>

    <main id="main">

        <h1 id="greet">Happy Birthday</h1>

        <div id="door1"></div>
        <div id="door2"></div>

    </main>

</body>
</html>
