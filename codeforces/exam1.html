<!DOCTYPE html>
<html>
<head>
<title>WEB Tech LAB</title>

<style>
*{box-sizing:border-box;margin:0}
body{font-family:Arial}

header{
 position:fixed;top:0;width:100%;height:55px;
 background:#263238;color:white;
 display:flex;align-items:center;
 padding:0 20px;z-index:10
}

.logo{flex:1;text-align:center;font-weight:bold}
header a{color:white;text-decoration:none;margin:10px}

#menu{display:none}

label{
 font-size:25px;
 cursor:pointer
}

/* Sidebar */
aside{
 position:fixed;top:55px;left:-180px;
 width:180px;height:100%;
 background:#263238;color:white;
 transition:.3s;
 z-index:5
}

aside a{
 display:block;color:white;
 text-decoration:none;padding:15px
}

aside a:hover{background:#455a64}

/* Open sidebar */
#menu:checked ~ aside{
 left:0
}

main{
 padding:90px 30px;
 margin-left:0
}

/* Mobile */
@media(max-width:600px){
 aside{
  width:100%;
  left:-100%;
 }
 #menu:checked ~ aside{
  left:0
 }
 header a{display:none}
}
</style>
</head>

<body>

<header>
 <label for="menu">☰</label>
 <input type="checkbox" id="menu">

 <div class="logo">University Portal</div>

 <nav>
  <a href="#">Home</a>
  <a href="#">Courses</a>
  <a href="#">Profile</a>
 </nav>
</header>

<aside>
 <a href="#">Dashboard</a>
 <a href="#">Courses</a>
 <a href="#">Settings</a>
 <a href="#">Logout</a>
</aside>

<main>
 <h2>Welcome to the University Dashboard</h2>
 <p>This is your main content area.</p>
</main>

</body>
</html>
