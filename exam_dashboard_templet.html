<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial;
        }

        /* Header */
        header{
            height:60px;
            background:#263238;
            color:white;
            display:flex;
            align-items:center;
            padding:0 20px;
        }

        header h2{
            flex:1;
        }

        header a{
            color:white;
            text-decoration:none;
            margin:10px;
        }

        /* Sidebar */
        aside{
            position:fixed;
            top:60px;
            left:0;
            width:200px;
            height:100%;
            background:#37474f;
        }

        aside a{
            display:block;
            color:white;
            padding:15px;
            text-decoration:none;
        }

        aside a:hover{
            background:#546e7a;
        }

        /* Main */
        main{
            margin-left:200px;
            padding:30px;
        }

        .cards{
            display:flex;
            gap:20px;
            margin-top:25px;
        }

        .card{
            padding:25px;
            background:#eee;
            width:200px;
        }

        /* Responsive */
        @media(max-width:600px){
            aside{
                width:100px;
            }

            main{
                margin-left:100px;
            }

            header a{
                display:none;
            }

            .cards{
                flex-direction:column;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h2>My Dashboard</h2>

        <nav>
            <a href="#">Home</a>
            <a href="#">Profile</a>
            <a href="#">Logout</a>
        </nav>
    </header>


    <!-- Sidebar -->
    <aside>
        <a href="#">Dashboard</a>
        <a href="#">Users</a>
        <a href="#">Courses</a>
        <a href="#">Settings</a>
    </aside>


    <!-- Main Content -->
    <main>

        <h1>Welcome to Dashboard</h1>
        <p>This is the main content area.</p>

        <div class="cards">

            <div class="card">
                <h3>Users</h3>
                <p>100</p>
            </div>

            <div class="card">
                <h3>Courses</h3>
                <p>20</p>
            </div>

            <div class="card">
                <h3>Students</h3>
                <p>500</p>
            </div>

        </div>

    </main>

</body>
</html>
